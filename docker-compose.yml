# One-command deploy for Qwen3-TTS (VoxServe)
#
#   docker compose up -d --build
#
# API:      http://HOST:2200
# Health:   http://HOST:2200/health
# Stats:    http://HOST:2200/stats
# WebSocket http://HOST:2200/ws
#
# Requires NVIDIA GPU + nvidia-container-toolkit on the host.

services:
  qwen3-tts:
    build:
      context: .
      dockerfile: Dockerfile
    image: reactivespace/qwen3-tts:latest
    container_name: qwen3-tts
    restart: unless-stopped
    ports:
      - "${PORT:-2200}:2200"
    environment:
      MODEL: ${MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
      PORT: "2200"
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-64}
      MAX_NUM_PAGES: ${MAX_NUM_PAGES:-2048}
      DETOKENIZE_INTERVAL: ${DETOKENIZE_INTERVAL:-5}
      SCHEDULER_TYPE: online
      ASYNC_SCHEDULING: "1"
      UNROLL_DEPTH_CUDA_GRAPH: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VOX_METRICS_DIR: /var/log/vox-serve
      VOX_OUTPUT_DIR: /data/voices
      HF_HOME: /data/hf-cache
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      # Persist model weights across restarts (large; first boot downloads ~few GB)
      - hf_cache:/data/hf-cache
      # Permanent metrics + server logs
      - vox_logs:/var/log/vox-serve
      # Optional: mount host voices / registered refs if you manage them outside
      - vox_voices:/data/voices
    shm_size: "8gb"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2200/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s

volumes:
  hf_cache:
  vox_logs:
  vox_voices:
