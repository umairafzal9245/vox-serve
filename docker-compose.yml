# One-command deploy for Qwen3-TTS (VoxServe)
#
#   docker compose up -d --build
#
# Model weights are downloaded (or copied from host HF cache) DURING IMAGE BUILD.
# Do not mount an empty volume over /data/hf-cache or you will hide the baked model.
#
# Requires NVIDIA GPU + nvidia-container-toolkit on the host.

services:
  qwen3-tts:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        # Slim host cache (run ./docker/prepare_hf_cache.sh) or empty → Hub download
        hfcache: ${HF_CACHE_HOST:-./docker/empty-hf}
      args:
        MODEL: ${MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
        HF_TOKEN: ${HF_TOKEN:-}
    image: reactivespace/qwen3-tts:latest
    container_name: qwen3-tts
    restart: unless-stopped
    ports:
      - "${PORT:-2200}:2200"
    environment:
      MODEL: ${MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
      PORT: "2200"
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-64}
      MAX_NUM_PAGES: ${MAX_NUM_PAGES:-2048}
      DETOKENIZE_INTERVAL: ${DETOKENIZE_INTERVAL:-5}
      SCHEDULER_TYPE: online
      ASYNC_SCHEDULING: "1"
      UNROLL_DEPTH_CUDA_GRAPH: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VOX_METRICS_DIR: /var/log/vox-serve
      VOX_OUTPUT_DIR: /data/voices
      HF_HOME: /data/hf-cache
      TRANSFORMERS_CACHE: /data/hf-cache
      HUGGINGFACE_HUB_CACHE: /data/hf-cache
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      # Permanent metrics + server logs (host path)
      - /var/log/vox-serve:/var/log/vox-serve
      # Registered voices persist on a named volume
      - vox_voices:/data/voices
    shm_size: "8gb"
    ulimits:
      memlock: -1
      stack: 67108864
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2200/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

volumes:
  vox_voices:
